<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>發文小幫手</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body data-liff-id="__LIFF_ID__">
  <header>
    <div>
      <p class="brand">璟豐</p>
      <h1>發文小幫手</h1>
    </div>
    <p id="who"></p>
  </header>
  <nav id="tabs" hidden>
    <button type="button" data-tab="inbox">收任務</button>
    <button type="button" data-tab="week">本週</button>
    <button type="button" data-tab="products" hidden>話術</button>
  </nav>
  <main id="app"><p class="muted">登入中…</p></main>
  <div id="busy" hidden>
    <div class="busy-box">
      <div class="spinner" aria-hidden="true"></div>
      <p>正在押上編號…</p>
    </div>
  </div>
  <p id="toast" hidden></p>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/app.js"></script>
</body>
</html>
